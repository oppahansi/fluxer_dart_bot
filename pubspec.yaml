name: fluxer_dart_bot
description: >-
  Example bot for the fluxer.dart framework — deliberately modest, meant to
  be read as a reference for how to build a bot with it, not a
  feature-complete bot.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2

dependencies:
  fluxer:
    path: ../fluxer.dart

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
