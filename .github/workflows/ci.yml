name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # fluxer_dart is a real git dependency pinned to a tagged ref in
      # pubspec.yaml (see pubspec_overrides.yaml.example for the local
      # path-override alternative) — it pulls in the rest of the
      # ecosystem transitively via its own pinned deps, so a plain
      # checkout + pub get is enough here.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
